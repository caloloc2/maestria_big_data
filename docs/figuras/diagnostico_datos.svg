<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <style>
    .h{font-size:16px;font-weight:600;fill:#2C2C2A}.lb{font-size:12px;fill:#5F5E5A}
    .big{font-size:24px;font-weight:500}.sec{font-size:13px;font-weight:600}
    .tl{fill:#0F6E56}.bl{fill:#185FA5}.am{fill:#854F0B}
  </style>

  <text class="h" x="24" y="30">Diagnóstico de datos (Fase 1) — hallazgos clave del CDR y las grabaciones</text>

  <text class="sec tl" x="24" y="60">CDR (metadatos, MariaDB) — universo analizado 2018→2026</text>
  <g>
    <rect x="24"  y="70" width="205" height="80" rx="12" fill="#E1F5EE" stroke="#0F6E56"/>
    <text class="big tl" x="40" y="110">24,77 M</text><text class="lb" x="40" y="132">registros CDR</text>
    <rect x="238" y="70" width="205" height="80" rx="12" fill="#E1F5EE" stroke="#0F6E56"/>
    <text class="big tl" x="254" y="110">2,25 %</text><text class="lb" x="254" y="132">corruptos (descartados)</text>
    <rect x="452" y="70" width="205" height="80" rx="12" fill="#E1F5EE" stroke="#0F6E56"/>
    <text class="big tl" x="468" y="110">53,2 %</text><text class="lb" x="468" y="132">contactabilidad global</text>
    <rect x="666" y="70" width="210" height="80" rx="12" fill="#E1F5EE" stroke="#0F6E56"/>
    <text class="big tl" x="682" y="110">0,13 %</text><text class="lb" x="682" y="132">urlrecord → enlace reconstruido</text>
  </g>

  <text class="sec" x="24" y="188" fill="#A32D2D">Caída de contactabilidad 2020→2024: −14 pp (efecto TrueCaller / apps anti-spam)</text>
  <line x1="24" y1="290" x2="360" y2="290" stroke="#5F5E5A" stroke-width="1.2"/>
  <rect x="70"  y="204" width="70" height="86" fill="#F7C1C1" stroke="#A32D2D"/>
  <text class="lb" x="105" y="198" text-anchor="middle" fill="#A32D2D">59,25 %</text>
  <text class="lb" x="105" y="306" text-anchor="middle">2020</text>
  <rect x="250" y="238" width="70" height="52" fill="#F7C1C1" stroke="#A32D2D"/>
  <text class="lb" x="285" y="232" text-anchor="middle" fill="#A32D2D">45,57 %</text>
  <text class="lb" x="285" y="306" text-anchor="middle">2024</text>
  <text class="lb" x="390" y="240">Muestra analítica =</text>
  <text class="lb" x="390" y="258">ANSWERED + billsec ∈ [10, 3600] s</text>
  <text class="lb" x="390" y="276">duración media 59,9 s · billsec 52,5 s</text>

  <text class="sec bl" x="24" y="344">Grabaciones (audio) — índice del filesystem (solo lectura)</text>
  <g>
    <rect x="24"  y="354" width="205" height="80" rx="12" fill="#E6F1FB" stroke="#185FA5"/>
    <text class="big bl" x="40" y="394">10,0 M</text><text class="lb" x="40" y="416">archivos · 858 GB · 97 % mp3</text>
    <rect x="238" y="354" width="205" height="80" rx="12" fill="#E6F1FB" stroke="#185FA5"/>
    <text class="big bl" x="254" y="394">7,06 M</text><text class="lb" x="254" y="416">alcance (ext 200-299 / OUT)</text>
    <rect x="452" y="354" width="205" height="80" rx="12" fill="#E6F1FB" stroke="#185FA5"/>
    <text class="big bl" x="468" y="394">424 GB</text><text class="lb" x="468" y="416">tamaño del alcance</text>
    <rect x="666" y="354" width="210" height="80" rx="12" fill="#E6F1FB" stroke="#185FA5"/>
    <text class="big bl" x="682" y="394">100</text><text class="lb" x="682" y="416">agentes de venta</text>
  </g>

  <rect x="24" y="452" width="852" height="34" rx="8" fill="#FAEEDA" stroke="#BA7517"/>
  <text class="sec am" x="40" y="474">Enlace CDR↔grabación RESUELTO: cobertura 100 % · llave = extensión + teléfono + ventana ±180 s (vecino más cercano)</text>
</svg>
