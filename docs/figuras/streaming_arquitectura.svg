<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .box{rx:8; stroke-width:1.5;}
      .lbl{font-size:13px; fill:#0f172a; font-weight:600;}
      .sub{font-size:11px; fill:#475569;}
      .flow{stroke:#334155; stroke-width:1.6; fill:none; marker-end:url(#arr);}
      .tag{font-size:10px; fill:#334155;}
    </style>
  </defs>

  <text x="490" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">
    Pipeline de streaming near-real-time (Fase 5)</text>
  <text x="490" y="48" text-anchor="middle" font-size="12" fill="#64748b">
    Llamada del asesor → detección por CDR → transcripción/anonimización → evaluación → tablero</text>

  <!-- FUENTE (solo lectura) -->
  <rect x="24" y="80" width="250" height="230" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-dasharray="6 4"/>
  <text x="149" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">ASTERISK (producción)</text>
  <text x="149" y="122" text-anchor="middle" font-size="11" fill="#b91c1c">🔒 ESTRICTO SOLO LECTURA — nunca se escribe</text>

  <rect x="48" y="140" width="200" height="66" rx="8" fill="#ffffff" stroke="#ef4444"/>
  <text x="148" y="165" text-anchor="middle" class="lbl">CDR (MariaDB 5.5.60)</text>
  <text x="148" y="184" text-anchor="middle" class="sub">usuario `lectura` = solo SELECT</text>
  <text x="148" y="198" text-anchor="middle" class="sub">GRANT SELECT ON asterisk.*</text>

  <rect x="48" y="222" width="200" height="70" rx="8" fill="#ffffff" stroke="#ef4444"/>
  <text x="148" y="247" text-anchor="middle" class="lbl">Grabaciones MP3</text>
  <text x="148" y="266" text-anchor="middle" class="sub">SFTP de lectura por ruta exacta</text>
  <text x="148" y="280" text-anchor="middle" class="sub">{ext}/OUT/{ts}-{ext}-{tel}.mp3</text>

  <!-- RUNNER -->
  <rect x="330" y="96" width="220" height="196" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="440" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Runner de streaming</text>
  <text x="440" y="136" text-anchor="middle" class="sub">src/streaming/runner.py</text>
  <text x="352" y="162" class="lbl">1 · POLL del CDR</text>
  <text x="352" y="178" class="sub">SELECT desde cursor (nuestro Postgres)</text>
  <text x="352" y="200" class="lbl">2 · LOCALIZA grabación</text>
  <text x="352" y="216" class="sub">sftp.stat nombre construido (±s)</text>
  <text x="352" y="238" class="lbl">3 · ATERRIZA MP3 → Bronce</text>
  <text x="352" y="254" class="sub">idempotente + estrangulado</text>
  <text x="352" y="276" class="lbl">4 · ENCOLA asr.jobs</text>

  <!-- LAGO -->
  <rect x="330" y="330" width="220" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="440" y="356" text-anchor="middle" class="lbl">Lago MinIO — Bronce</text>
  <text x="440" y="374" text-anchor="middle" class="sub">bronce/audio/date=.../*.mp3</text>
  <text x="440" y="390" text-anchor="middle" class="sub">MP3 crudo (auditoría)</text>

  <!-- KAFKA -->
  <rect x="600" y="150" width="150" height="60" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="675" y="176" text-anchor="middle" class="lbl">Kafka</text>
  <text x="675" y="194" text-anchor="middle" class="sub">asr.jobs / asr.results</text>

  <!-- WORKER -->
  <rect x="790" y="96" width="170" height="150" rx="12" fill="#faf5ff" stroke="#9333ea"/>
  <text x="875" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">Whisper worker</text>
  <text x="875" y="136" text-anchor="middle" class="sub">host + OpenVINO (GPU Arc)</text>
  <text x="806" y="160" class="sub">• lee MP3 desde MinIO</text>
  <text x="806" y="178" class="sub">• ASR + anti-alucinación</text>
  <text x="806" y="196" class="sub">• diariza solo largas</text>
  <text x="806" y="214" class="sub">• anonimiza (Presidio)</text>
  <text x="806" y="232" class="sub">→ solo texto anónimo sale</text>

  <!-- SERVING -->
  <rect x="600" y="300" width="360" height="110" rx="12" fill="#f8fafc" stroke="#0ea5e9"/>
  <text x="780" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#0369a1">Capa servida — PostgreSQL</text>
  <text x="780" y="344" text-anchor="middle" class="sub">5 · DRENA asr.results → transcripciones</text>
  <text x="780" y="362" text-anchor="middle" class="sub">6 · EVALÚA (Gemini, texto anónimo) → evaluaciones</text>
  <text x="780" y="382" text-anchor="middle" class="sub">servido.llamadas (origen='streaming') + cursor</text>
  <text x="780" y="400" text-anchor="middle" class="sub">idempotente por call_id</text>

  <!-- DASHBOARD -->
  <rect x="600" y="440" width="360" height="66" rx="12" fill="#ecfeff" stroke="#06b6d4"/>
  <text x="780" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">Tablero (Streamlit :8501)</text>
  <text x="780" y="486" text-anchor="middle" class="sub">Resumen · Tiempo real · Por agente · Calidad · Intentos · Anomalías</text>

  <!-- flows -->
  <path class="flow" d="M248 173 L326 173"/>
  <text x="287" y="166" text-anchor="middle" class="tag">SELECT</text>
  <path class="flow" d="M248 257 L326 232"/>
  <text x="287" y="238" text-anchor="middle" class="tag">stat/get</text>
  <path class="flow" d="M440 292 L440 328"/>
  <text x="470" y="314" text-anchor="middle" class="tag">put MP3</text>
  <path class="flow" d="M550 200 L596 185"/>
  <text x="575" y="176" text-anchor="middle" class="tag">job</text>
  <path class="flow" d="M750 172 L786 168"/>
  <path class="flow" d="M840 246 L720 300" />
  <text x="795" y="284" text-anchor="middle" class="tag">result</text>
  <path class="flow" d="M675 210 L678 296" stroke-dasharray="3 3"/>
  <path class="flow" d="M780 410 L780 436"/>
  <!-- worker reads lake -->
  <path class="flow" d="M552 352 C640 420 900 300 872 250" stroke="#16a34a" stroke-dasharray="4 3"/>
  <text x="700" y="420" text-anchor="middle" class="tag" fill="#16a34a">MP3 desde el lago</text>

  <text x="490" y="536" text-anchor="middle" font-size="11" fill="#64748b">
    Garantía de seguridad: el usuario de BD solo tiene SELECT y todo el acceso a grabaciones es SFTP de lectura → cero cambios en Asterisk.</text>
</svg>
