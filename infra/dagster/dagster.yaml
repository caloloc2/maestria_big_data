# Configuración de Dagster (DAGSTER_HOME). Almacena runs, event log y schedules
# en PostgreSQL (servicio `postgres` de docker-compose), no en SQLite.
storage:
  postgres:
    postgres_db:
      username: dagster
      password: dagster
      hostname: postgres
      db_name: dagster
      port: 5432

telemetry:
  enabled: false
